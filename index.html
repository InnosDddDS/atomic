
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тихий сад</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Quicksand:wght@400;600;700&family=Caveat:wght@600;700&display=swap');

:root{
  --sky-top:#cdb7da;
  --sky-mid:#f0b9c4;
  --sky-bottom:#f8dcc6;
  --sakura-deep:#e98fb0;
  --sakura-mid:#f3b9cf;
  --sakura-light:#fbdde9;
  --cat-fur:#cdb7a0;
  --cat-fur-dark:#a98a6e;
  --cat-cream:#fff8ee;
  --ink:#5b4034;
  --ink-soft:#8a6a57;
  --gold:#f4d58d;
  --card-bg:#fffaf4;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Quicksand',sans-serif;
  color:var(--ink);
  overflow:hidden;
  height:100dvh;
  width:100%;
}

.scene{
  position:relative;
  height:100dvh;
  width:100%;
  overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-bottom) 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}

@media (prefers-reduced-motion:no-preference){
  .scene{ animation:skyBreathe 18s ease-in-out infinite; }
}
@keyframes skyBreathe{
  0%,100%{ filter:saturate(1) brightness(1); }
  50%{ filter:saturate(1.05) brightness(1.03); }
}

.label{
  position:absolute;
  top:max(22px, env(safe-area-inset-top));
  left:0;right:0;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:15px;
  letter-spacing:.12em;
  color:var(--ink-soft);
  opacity:.75;
  z-index:6;
  user-select:none;
}

/* hint под котиком */
.tap-hint {
  position:absolute;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 70px));
  left:0; right:0;
  text-align:center;
  font-family:'Quicksand',sans-serif;
  font-size:12px;
  color:var(--ink-soft);
  opacity:0.6;
  z-index:6;
  pointer-events:none;
  animation: hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse{
  0%,100%{opacity:0.4;}
  50%{opacity:0.75;}
}

/* ---------- sky decoration ---------- */
.sky-deco{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

.moon{
  position:absolute;
  top:7%; right:9%;
  width:clamp(46px, 9vw, 76px);
  height:clamp(46px, 9vw, 76px);
  border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #fffdf6, #fbe9c8 60%, #f3d9a3 100%);
  box-shadow:0 0 30px 14px rgba(252,232,184,.45), 0 0 60px 30px rgba(252,232,184,.18);
}
@media (prefers-reduced-motion:no-preference){
  .moon{ animation:moonGlow 6s ease-in-out infinite; }
}
@keyframes moonGlow{
  0%,100%{ box-shadow:0 0 30px 14px rgba(252,232,184,.4), 0 0 60px 30px rgba(252,232,184,.16); }
  50%{ box-shadow:0 0 38px 18px rgba(252,232,184,.55), 0 0 72px 36px rgba(252,232,184,.24); }
}

.star{
  position:absolute;
  width:3px; height:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 5px 1px rgba(255,255,255,.8);
}
@media (prefers-reduced-motion:no-preference){
  .star{ animation:starTwinkle 3.4s ease-in-out infinite; }
}
@keyframes starTwinkle{
  0%,100%{ opacity:.2; transform:scale(.7); }
  50%{ opacity:1; transform:scale(1.2); }
}

.cloud{
  position:absolute;
  border-radius:50%;
  filter:blur(7px);
  opacity:.4;
  background:radial-gradient(circle, #ffffff, rgba(255,255,255,0) 70%);
}
.cloud-1{ width:160px; height:46px; top:14%; left:-20%; animation:driftCloud 95s linear infinite; }
.cloud-2{ width:120px; height:36px; top:22%; left:-40%; animation:driftCloud 130s linear infinite; animation-delay:-30s; opacity:.3; }
.cloud-3{ width:90px; height:30px; top:9%; left:-60%; animation:driftCloud 160s linear infinite; animation-delay:-70s; opacity:.28; }
@keyframes driftCloud{ from{ transform:translateX(0); } to{ transform:translateX(160vw); } }

.ground-glow{
  position:absolute;
  bottom:6%;
  left:50%;
  width:min(70vw, 460px);
  height:120px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center, rgba(244,213,141,.35), rgba(244,213,141,0) 70%);
  z-index:1;
  pointer-events:none;
}

/* ---------- illustration ---------- */
.illustration-wrap{
  position:relative;
  width:min(92vw, 520px);
  margin-top:auto;
  z-index:2;
  cursor:pointer;
}
.illustration{
  display:block;
  width:100%;
  height:auto;
  transform-origin:50% 95%;
}
@media (prefers-reduced-motion:no-preference){
  .tree-sway{ animation:sway 7s ease-in-out infinite; transform-origin:20% 100%; }
  .cat-breathe{ animation:breathe 4.5s ease-in-out infinite; transform-origin:50% 80%; }
  .blade{ animation:bladeSway 5s ease-in-out infinite; transform-origin:50% 100%; }
}
@keyframes sway{
  0%,100%{ transform:rotate(-0.6deg); }
  50%{ transform:rotate(0.6deg); }
}
@keyframes breathe{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.012); }
}
@keyframes bladeSway{
  0%,100%{ transform:rotate(-3deg); }
  50%{ transform:rotate(3deg); }
}

/* ХВОСТИК - отдельный анимированный элемент */
.tail-anim {
  animation: tailWag 3.8s ease-in-out infinite;
  transform-origin: 468px 565px;
}
@keyframes tailWag {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(6deg); }
  75%  { transform: rotate(-5deg); }
  100% { transform: rotate(0deg); }
}
@media (prefers-reduced-motion:reduce){ .tail-anim{ animation:none; } }

/* ЖИВЫЕ ГЛАЗКИ */
.eye-group { cursor:pointer; }

/* Зрачок — моргание через clipPath высоты */
.pupil-l, .pupil-r {
  animation: pupilBlink 5s ease-in-out infinite;
  transform-origin: center;
}
.pupil-r { animation-delay: 0.05s; }
@keyframes pupilBlink {
  0%,42%,58%,100% { transform: scaleY(1); }
  48%,52% { transform: scaleY(0.08); }
}

/* Блик */
.eye-shine { pointer-events:none; }

/* Котик при тапе — лёгкий прыжок */
.cat-bounce {
  animation: catJump 0.5s ease;
}
@keyframes catJump {
  0%{ transform: scale(1) translateY(0); }
  40%{ transform: scale(1.04) translateY(-6px); }
  100%{ transform: scale(1) translateY(0); }
}

/* ---------- РЕЧЕВОЕ ОБЛАЧКО ---------- */
.speech-bubble {
  position:absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-60%) translateY(-100%);
  background: rgba(255, 250, 248, 0.97);
  border: 2px solid var(--sakura-mid);
  border-radius: 20px;
  padding: 10px 16px;
  font-family:'Caveat', cursive;
  font-size: clamp(15px, 4.5vw, 19px);
  color: var(--ink);
  white-space: nowrap;
  box-shadow: 0 6px 22px rgba(233,143,176,.28);
  pointer-events:none;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  max-width: min(75vw, 280px);
  white-space: normal;
  text-align: center;
  line-height:1.3;
}
.speech-bubble::after {
  content:'';
  position:absolute;
  bottom:-12px;
  left: 58%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top:8px solid var(--sakura-mid);
}
.speech-bubble::before {
  content:'';
  position:absolute;
  bottom:-9px;
  left: 58%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top:7px solid rgba(255,250,248,0.97);
  z-index:1;
}
.speech-bubble.visible {
  opacity:1;
  transform: translateX(-60%) translateY(calc(-100% - 8px));
}

/* ---------- petals ---------- */
.petals{ position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
.petal{
  position:absolute;
  top:-5%;
  border-radius:0 60% 0 60%;
  animation-name:fall, drift;
  animation-timing-function:linear, ease-in-out;
  animation-iteration-count:infinite, infinite;
}
.petal--far{
  background:linear-gradient(135deg,var(--sakura-light),var(--sakura-mid));
  opacity:.55;
  filter:blur(1px);
}
.petal--near{
  background:linear-gradient(135deg,var(--sakura-mid),var(--sakura-deep));
  opacity:.9;
}
@keyframes fall{
  from{ transform:translateY(-10vh) rotate(0deg); }
  to{ transform:translateY(110vh) rotate(360deg); }
}
@keyframes drift{
  0%,100%{ margin-left:0; }
  50%{ margin-left:30px; }
}
@media (prefers-reduced-motion:reduce){ .petal{ display:none; } }

/* ---------- fireflies ---------- */
.fireflies{ position:absolute; inset:0; pointer-events:none; z-index:1; }
.firefly{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px 2px rgba(244,213,141,.7);
  animation:fireflyFloat 5s ease-in-out infinite;
}
@keyframes fireflyFloat{
  0%,100%{ opacity:.15; transform:scale(.8) translateY(0) translateX(0); }
  50%{ opacity:.9; transform:scale(1.15) translateY(-10px) translateX(4px); }
}

.vignette{
  position:absolute; inset:0;
  z-index:4;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0) 45%, rgba(91,64,52,.22) 100%);
}

/* ---------- letter button ---------- */
.letter-btn{
  position:relative;
  z-index:7;
  margin:0 auto clamp(20px, 4vh, 44px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 26px;
  border:none;
  border-radius:999px;
  background:rgba(255,250,244,.88);
  backdrop-filter:blur(6px);
  box-shadow:0 6px 22px rgba(180,110,130,.28), 0 0 0 1px rgba(255,255,255,.5) inset;
  font-family:'Quicksand',sans-serif;
  font-weight:600;
  font-size:16px;
  color:var(--ink);
  cursor:pointer;
  transition:transform .25s ease, box-shadow .25s ease;
  animation:glow 3.6s ease-in-out infinite;
}
.letter-btn:hover, .letter-btn:focus-visible{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 10px 28px rgba(180,110,130,.38), 0 0 0 1px rgba(255,255,255,.6) inset;
}
@keyframes glow{
  0%,100%{ box-shadow:0 6px 22px rgba(180,110,130,.22), 0 0 0 1px rgba(255,255,255,.5) inset; }
  50%{ box-shadow:0 6px 26px rgba(233,143,176,.45), 0 0 0 1px rgba(255,255,255,.6) inset; }
}
.letter-btn svg{ width:22px; height:22px; flex:none; }
@media (prefers-reduced-motion:no-preference){
  .letter-btn svg{ animation:envWiggle 4s ease-in-out infinite; transform-origin:50% 70%; }
}
@keyframes envWiggle{
  0%,100%{ transform:rotate(0deg); }
  50%{ transform:rotate(-4deg); }
}

/* ---------- overlay & card ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(91,64,52,.25);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease;
  z-index:50;
  padding:20px;
}
.overlay.visible{ opacity:1; visibility:visible; }

.card{
  position:relative;
  width:min(420px, 100%);
  background:
    repeating-linear-gradient(135deg, rgba(91,64,52,.025) 0 2px, transparent 2px 10px),
    var(--card-bg);
  border-radius:22px;
  padding:34px 28px 30px;
  text-align:center;
  box-shadow:0 24px 60px rgba(91,64,52,.25);
  transform:translateY(14px) scale(.97);
  transition:transform .35s ease;
  overflow:hidden;
}
.overlay.visible .card{ transform:translateY(0) scale(1); }

.card-decor{
  position:absolute;
  bottom:10px; right:14px;
  width:38px; height:38px;
  opacity:.14;
  pointer-events:none;
}

.card-question{ transition:opacity .25s ease, transform .25s ease; }
.card-question.fade-out{ opacity:0; transform:translateY(-6px) scale(.98); }
.card-question p{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:24px;
  margin:6px 0 26px;
  color:var(--ink);
}
.card-question .envelope-mini{
  width:64px; height:64px;
  margin:0 auto 14px;
}
@media (prefers-reduced-motion:no-preference){
  .card-question .envelope-mini{ animation:miniWiggle 3.6s ease-in-out infinite; transform-origin:50% 75%; }
}
@keyframes miniWiggle{
  0%,100%{ transform:rotate(0deg); }
  50%{ transform:rotate(-3deg); }
}
.card-actions{ display:flex; gap:14px; justify-content:center; }
.btn{
  font-family:'Quicksand',sans-serif;
  font-weight:700;
  font-size:15px;
  padding:11px 28px;
  border-radius:999px;
  cursor:pointer;
  border:2px solid transparent;
  transition:transform .2s ease, opacity .2s ease;
}
.btn:hover{ transform:translateY(-1px); }
.btn-yes{ background:var(--sakura-deep); color:#fff; box-shadow:0 8px 18px rgba(233,143,176,.45); }
.btn-no{ background:transparent; border-color:var(--sakura-mid); color:var(--ink-soft); }

.card-letter{ display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
.card-letter .seal{ width:46px; height:46px; margin-bottom:10px; opacity:0; }
.letter-text{ font-family:'Caveat',cursive; font-size:34px; line-height:1.35; color:var(--ink); margin:4px 0 10px; opacity:0; }
.flourish{ width:120px; height:20px; margin:4px auto 14px; opacity:0; color:var(--sakura-deep); }
.heart-tail{ display:inline-block; animation:beat 1.4s ease-in-out infinite; }
@keyframes beat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }

.card-letter.reveal .seal{ animation:sealPop .6s ease forwards; }
.card-letter.reveal .letter-text{ animation:fadeUp .6s .15s ease forwards; }
.card-letter.reveal .flourish{ animation:fadeUp .6s .35s ease forwards; }
.card-letter.reveal .close-btn{ animation:fadeUp .5s .5s ease forwards; opacity:0; }
@keyframes sealPop{
  0%{ transform:scale(.4) rotate(-15deg); opacity:0; }
  60%{ transform:scale(1.15) rotate(5deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

.close-btn{
  margin-top:4px;
  background:none;
  border:none;
  font-family:'Quicksand',sans-serif;
  font-weight:600;
  font-size:14px;
  color:var(--ink-soft);
  cursor:pointer;
  text-decoration:underline;
  text-decoration-color:var(--sakura-mid);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;
  bottom:max(26px, env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(91,64,52,.92);
  color:#fff8f2;
  font-family:'Quicksand',sans-serif;
  font-weight:600;
  font-size:14px;
  padding:12px 20px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
  z-index:60;
  max-width:88vw;
  text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.burst{ position:fixed; inset:0; pointer-events:none; z-index:55; }
.burst-heart{ position:absolute; bottom:-5%; font-size:18px; opacity:.9; animation:floatUp linear forwards; }
@keyframes floatUp{ to{ transform:translateY(-115vh) translateX(var(--bx,0px)) rotate(20deg); opacity:0; } }

@media (max-width:480px){
  .letter-text{ font-size:28px; }
  .card{ padding:28px 20px 24px; }
}
</style>
</head>
<body>

<div class="scene">
  <div class="sky-deco" id="skyDeco">
    <div class="moon"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div class="ground-glow"></div>
  <div class="label">тихий сад · вечер</div>

  <div class="fireflies" id="fireflies"></div>
  <div class="petals" id="petals"></div>

  <div class="illustration-wrap" id="catWrap">

    <!-- Речевое облачко -->
    <div class="speech-bubble" id="speechBubble"></div>

    <svg class="illustration" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Котёнок отдыхает под цветущей сакурой">
      <!-- ground -->
      <ellipse cx="400" cy="585" rx="360" ry="34" fill="#e7c9b6" opacity="0.55"/>
      <path d="M0,605 Q200,580 400,600 T800,595 V620 H0 Z" fill="#dab48e" opacity="0.5"/>

      <!-- grass blades -->
      <g stroke="#9fae7a" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
        <path class="blade" d="M560,600 Q565,575 558,558"/>
        <path class="blade" d="M578,602 Q585,580 580,562" style="animation-delay:-1.2s"/>
        <path class="blade" d="M600,604 Q605,582 598,566" style="animation-delay:-2.4s"/>
        <path class="blade" d="M120,608 Q126,588 119,572" style="animation-delay:-0.6s"/>
        <path class="blade" d="M745,602 Q750,580 743,564" style="animation-delay:-1.8s"/>
      </g>

      <!-- tree -->
      <g class="tree-sway">
        <path d="M150,610 C140,520 165,470 150,430 C140,400 175,390 185,360 C170,330 190,300 215,290"
              fill="none" stroke="#7a5240" stroke-width="16" stroke-linecap="round"/>
        <path d="M185,420 C150,400 120,410 95,395" fill="none" stroke="#7a5240" stroke-width="10" stroke-linecap="round"/>
        <path d="M170,460 C200,450 225,460 250,445" fill="none" stroke="#7a5240" stroke-width="9" stroke-linecap="round"/>

        <g opacity="0.95">
          <circle cx="120" cy="380" r="58" fill="var(--sakura-light)"/>
          <circle cx="190" cy="345" r="70" fill="var(--sakura-mid)"/>
          <circle cx="260" cy="370" r="56" fill="var(--sakura-light)"/>
          <circle cx="95" cy="320" r="46" fill="var(--sakura-mid)"/>
          <circle cx="220" cy="290" r="52" fill="var(--sakura-deep)" opacity="0.55"/>
          <circle cx="155" cy="300" r="50" fill="var(--sakura-light)"/>
          <circle cx="290" cy="320" r="40" fill="var(--sakura-mid)"/>
          <circle cx="60" cy="370" r="34" fill="var(--sakura-light)"/>
        </g>
        <g fill="var(--sakura-deep)" opacity="0.5">
          <circle cx="130" cy="360" r="3"/><circle cx="170" cy="330" r="3"/>
          <circle cx="210" cy="360" r="3"/><circle cx="240" cy="300" r="3"/>
          <circle cx="100" cy="330" r="3"/><circle cx="270" cy="345" r="3"/>
          <circle cx="150" cy="380" r="3"/>
        </g>
      </g>

      <!-- resting kitten -->
      <g class="cat-breathe" id="catGroup">

        <ellipse cx="420" cy="600" rx="48" ry="10" fill="#5b4034" opacity="0.12"/>

        <!-- АНИМИРОВАННЫЙ ХВОСТИК -->
        <g class="tail-anim">
          <path d="M468,565 C545,560 565,495 515,455 C495,438 463,452 466,478 C468,500 495,500 500,480"
                fill="var(--cat-fur)"/>
          <path d="M515,455 C495,438 463,452 466,478" fill="none" stroke="var(--cat-fur-dark)" stroke-width="2" opacity="0.4"/>
          <circle cx="473" cy="467" r="12" fill="#fff"/>
          <!-- полоски на хвосте -->
          <path d="M490,465 C500,462 508,466 512,470" fill="none" stroke="var(--cat-fur-dark)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
          <path d="M478,490 C487,488 494,492 497,496" fill="none" stroke="var(--cat-fur-dark)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </g>

        <!-- body -->
        <ellipse cx="408" cy="558" rx="60" ry="48" fill="var(--cat-fur)"/>
        <ellipse cx="410" cy="576" rx="36" ry="24" fill="var(--cat-cream)"/>

        <!-- head -->
        <circle cx="368" cy="513" r="42" fill="var(--cat-fur)"/>
        <ellipse cx="366" cy="526" rx="20" ry="14" fill="var(--cat-cream)"/>

        <!-- ears -->
        <path d="M338,488 L320,440 L368,476 Z" fill="var(--cat-fur)"/>
        <path d="M340,480 L330,455 L358,474 Z" fill="var(--sakura-mid)" opacity="0.7"/>
        <path d="M396,480 L412,434 L424,478 Z" fill="var(--cat-fur)"/>
        <path d="M400,476 L411,452 L418,476 Z" fill="var(--sakura-mid)" opacity="0.7"/>

        <!-- soft tabby strokes -->
        <g stroke="var(--cat-fur-dark)" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none">
          <path d="M345,478 q4,-14 14,-18"/>
          <path d="M395,478 q-4,-14 -14,-18"/>
          <path d="M388,532 q10,8 4,22"/>
          <path d="M404,528 q10,10 2,24"/>
        </g>

        <!-- ЖИВЫЕ ГЛАЗА -->
        <!-- Левый глаз -->
        <g id="leftEye">
          <!-- белок -->
          <ellipse cx="356" cy="510" rx="10" ry="9" fill="white"/>
          <!-- радужка -->

  background:linear-gradient(135deg,var(--sakura-mid),var(--sakura-deep));
  opacity:.9;
}
@keyframes fall{
  from{ transform:translateY(-10vh) rotate(0deg); }
  to{ transform:translateY(110vh) rotate(360deg); }
}
@keyframes drift{
  0%,100%{ margin-left:0; }
  50%{ margin-left:30px; }
}
@media (prefers-reduced-motion:reduce){ .petal{ display:none; } }

/* ---------- fireflies ---------- */
.fireflies{ position:absolute; inset:0; pointer-events:none; z-index:1; }
.firefly{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px 2px rgba(244,213,141,.7);
  animation:fireflyFloat 5s ease-in-out infinite;
}
@keyframes fireflyFloat{
  0%,100%{ opacity:.15; transform:scale(.8) translateY(0) translateX(0); }
  50%{ opacity:.9; transform:scale(1.15) translateY(-10px) translateX(4px); }
}

.vignette{
  position:absolute; inset:0;
  z-index:4;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0) 45%, rgba(91,64,52,.22) 100%);
}

/* ---------- letter button ---------- */
.letter-btn{
  position:relative;
  z-index:7;
  margin:0 auto clamp(20px, 4vh, 44px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 26px;
  border:none;
  border-radius:999px;
  background:rgba(255,250,244,.88);
  backdrop-filter:blur(6px);
  box-shadow:0 6px 22px rgba(180,110,130,.28), 0 0 0 1px rgba(255,255,255,.5) inset;
  font-family:'Quicksand',sans-serif;
  font-weight:600;
  font-size:16px;
  color:var(--ink);
  cursor:pointer;
  transition:transform .25s ease, box-shadow .25s ease;
  animation:glow 3.6s ease-in-out infinite;
}
.letter-btn:hover, .letter-btn:focus-visible{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 10px 28px rgba(180,110,130,.38), 0 0 0 1px rgba(255,255,255,.6) inset;
}
@keyframes glow{
  0%,100%{ box-shadow:0 6px 22px rgba(180,110,130,.22), 0 0 0 1px rgba(255,255,255,.5) inset; }
  50%{ box-shadow:0 6px 26px rgba(233,143,176,.45), 0 0 0 1px rgba(255,255,255,.6) inset; }
}
.letter-btn svg{ width:22px; height:22px; flex:none; }
@media (prefers-reduced-motion:no-preference){
  .letter-btn svg{ animation:envWiggle 4s ease-in-out infinite; transform-origin:50% 70%; }
}
@keyframes envWiggle{
  0%,100%{ transform:rotate(0deg); }
  50%{ transform:rotate(-4deg); }
}

/* ---------- overlay & card ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(91,64,52,.25);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease;
  z-index:50;
  padding:20px;
}
.overlay.visible{ opacity:1; visibility:visible; }

.card{
  position:relative;
  width:min(420px, 100%);
  background:
    repeating-linear-gradient(135deg, rgba(91,64,52,.025) 0 2px, transparent 2px 10px),
    var(--card-bg);
  border-radius:22px;
  padding:34px 28px 30px;
  text-align:center;
  box-shadow:0 24px 60px rgba(91,64,52,.25);
  transform:translateY(14px) scale(.97);
  transition:transform .35s ease;
  overflow:hidden;
}
.overlay.visible .card{ transform:translateY(0) scale(1); }

.card-decor{
  position:absolute;
  bottom:10px; right:14px;
  width:38px; height:38px;
  opacity:.14;
  pointer-events:none;
}

.card-question{ transition:opacity .25s ease, transform .25s ease; }
.card-question.fade-out{ opacity:0; transform:translateY(-6px) scale(.98); }
.card-question p{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:24px;

}
.card-question .envelope-mini{

}
@media (prefers-reduced-motion:no-preference){

}
@keyframes miniWiggle{
  0%,100%{ transform:rotate(0deg); }
  50%{ transform:rotate(-3deg); }
}
.card-actions{ display:flex; gap:14px; justify-content:center; }
.btn{
  font-family:'Quicksand',sans-serif;
  font-weight:700;
  font-size:15px;
  padding:11px 28px;
  border-radius:999px;
  cursor:pointer;
  border:2px solid transparent;
  transition:transform .2s ease, opacity .2s ease;
}
.btn:hover{ transform:translateY(-1px); }
.btn-yes{ background:var(--sakura-deep); color:#fff; box-shadow:0 8px 18px rgba(233,143,176,.45); }
.btn-no{ background:transparent; border-color:var(--sakura-mid); color:var(--ink-soft); }

.card-letter{ display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
.card-letter .seal{ width:46px; height:46px; margin-bottom:10px; opacity:0; }
.letter-text{ font-family:'Caveat',cursive; font-size:34px; line-height:1.35; color:var(--ink); margin:4px 0 10px; opacity:0; }
.flourish{ width:120px; height:20px; margin:4px auto 14px; opacity:0; color:var(--sakura-deep); }
.heart-tail{ display:inline-block; animation:beat 1.4s ease-in-out infinite; }
@keyframes beat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }

.card-letter.reveal .seal{ animation:sealPop .6s ease forwards; }
.card-letter.reveal .letter-text{ animation:fadeUp .6s .15s ease forwards; }
.card-letter.reveal .flourish{ animation:fadeUp .6s .35s ease forwards; }
.card-letter.reveal .close-btn{ animation:fadeUp .5s .5s ease forwards; opacity:0; }
@keyframes sealPop{
  0%{ transform:scale(.4) rotate(-15deg); opacity:0; }
  60%{ transform:scale(1.15) rotate(5deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

.close-btn{

  border:none;

  font-size:14px;
  color:var(--ink-soft);

  text-decoration:underline;

}

/* ---------- toast ---------- */
.toast{
  position:fixed;
  bottom:max(26px, env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(91,64,52,.92);

  font-weight:600;

  z-index:60;

}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.burst{ position:fixed; inset:0; pointer-events:none; z-index:55; }
.burst-heart{ position:absolute; bottom:-5%; font-size:18px; opacity:.9; animation:floatUp linear forwards; }
@keyframes floatUp{ to{ transform:translateY(-115vh) translateX(var(--bx,0px)) rotate(20deg); opacity:0; } }

@media (max-width:480px){
  .letter-text{ font-size:28px; }
  .card{ padding:28px 20px 24px; }
}

(function(){
  // Лепестки
  var petalsHost = document.getElementById('petals');
  var nFar = window.innerWidth < 600 ? 10 : 16;
  var nNear = window.innerWidth < 600 ? 8 : 12;
  function makePetal(kind){
    var p = document.createElement('div');
    p.className = 'petal ' + kind;
    var left = Math.random()*100;
    var size = kind === 'petal--far' ? (6+Math.random()*5) : (9+Math.random()*8);
    var fallDur = kind === 'petal--far' ? (14+Math.random()*10) : (8+Math.random()*8);
    var driftDur = 3 + Math.random()*3;
    var delay = Math.random()*14;
    p.style.left = left + 'vw';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.animationDuration = fallDur+'s, '+driftDur+'s';
    p.style.animationDelay = (-delay)+'s, '+(Math.random()*2)+'s';
    petalsHost.appendChild(p);
  }
  for (var i=0;i<nFar;i++) makePetal('petal--far');
  for (var i2=0;i2<nNear;i2++) makePetal('petal--near');

  // Светлячки
  var fireHost = document.getElementById('fireflies');
  for (var j=0;j<14;j++){
    var f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (Math.random()*100)+'vw';
    f.style.top = (35+Math.random()*55)+'vh';
    f.style.animationDelay = (Math.random()*4)+'s';
    f.style.animationDuration = (4+Math.random()*3)+'s';
    fireHost.appendChild(f);
  }

  // Звёзды
  var skyDeco = document.getElementById('skyDeco');
  for (var k=0;k<13;k++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (2+Math.random()*34)+'vh';
    s.style.animationDelay = (Math.random()*3.4)+'s';
    skyDeco.appendChild(s);
  }

  // ========== РЕЧЕВЫЕ ФРАЗОЧКИ ==========
  var phrases = [
    'Мяур, мама я люблю тебя 🐾',
    'Ты такая милашка ✨',
    'Спасибо, что ты есть! 💕',
    'Мама это ты! И ты прекрасна! 🌸',
    'Я так люблю тебя 💗',
    'Оии! Мяруру ярярряммямямя 😸',
    'Папа всегда рядом 🐈'
  ];
  var phraseIndex = 0;
  var bubbleTimer = null;
  var bubble = document.getElementById('speechBubble');
  var catWrap = document.getElementById('catWrap');
  var catGroup = document.getElementById('catGroup');
  var tapping = false;

  catWrap.addEventListener('click', function(e){
    // Не срабатывать если нажали на кнопку письма
    if (e.target.closest('.letter-btn')) return;
    showPhrase();
  });
  catWrap.addEventListener('touchend', function(e){
    if (e.target.closest('.letter-btn')) return;
    e.preventDefault();
    showPhrase();
  }, {passive:false});

  function showPhrase(){
    if (tapping) return;
    tapping = true;
    setTimeout(function(){ tapping = false; }, 400);

    // Показываем фразу
    var text = phrases[phraseIndex];
    phraseIndex = (phraseIndex + 1) % phrases.length;
    bubble.textContent = text;
    bubble.classList.add('visible');

    // Анимация котика
    catGroup.classList.remove('cat-bounce');
    void catGroup.offsetWidth; // reflow
    catGroup.classList.add('cat-bounce');

    // Прячем облачко через 2.8с
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){
      bubble.classList.remove('visible');
    }, 2800);

    // Мигание при тапе
    triggerBlink();
  }

  // Принудительное моргание при тапе
  function triggerBlink(){
    var pupils = document.querySelectorAll('.pupil-l, .pupil-r');
    pupils.forEach(function(p){
      p.style.animation = 'none';
      p.style.transform = 'scaleY(0.08)';
      setTimeout(function(){
        p.style.transform = '';
        setTimeout(function(){
          p.style.animation = '';
        }, 120);
      }, 140);
    });
  }

  // ========== ПИСЬМО ==========
  var overlay = document.getElementById('overlay');
  var letterBtn = document.getElementById('letterBtn');
  var cardQuestion = document.getElementById('cardQuestion');
  var cardLetter = document.getElementById('cardLetter');
  var btnYes = document.getElementById('btnYes');
  var btnNo = document.getElementById('btnNo');
  var closeBtn = document.getElementById('closeBtn');
  var toast = document.getElementById('toast');
  var burst = document.getElementById('burst');
  var toastTimer;

  function resetCard(){
    cardQuestion.hidden = false;
    cardQuestion.classList.remove('fade-out');
    cardLetter.hidden = true;
    cardLetter.classList.remove('reveal');
  }
  function openOverlay(){
    resetCard();
    overlay.classList.add('visible');
  }
  function closeOverlay(){
    overlay.classList.remove('visible');
  }
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
  }
  function heartBurst(){
    var count = window.innerWidth < 600 ? 10 : 16;
    var glyphs = ['♥','♥','✿'];
    for (var k2=0;k2<count;k2++){
      var h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      h.style.left = (10+Math.random()*80)+'vw';
      h.style.setProperty('--bx', (Math.random()*60-30)+'px');
      h.style.color = Math.random() > 0.5 ? '#e98fb0' : '#f4d58d';
      h.style.animationDuration = (3.5+Math.random()*2)+'s';
      burst.appendChild(h);
      (function(el){ setTimeout(function(){ el.remove(); }, 6000); })(h);
    }
  }

  letterBtn.addEventListener('click', openOverlay);

  btnYes.addEventListener('click', function(){
    cardQuestion.classList.add('fade-out');
    setTimeout(function(){
      cardQuestion.hidden = true;
      cardLetter.hidden = false;
      cardLetter.classList.add('reveal');
      heartBurst();
    }, 260);
  });

  btnNo.addEventListener('click', function(){
    closeOverlay();
    showToast('Хорошо, я подожду тебя 🐾');
  });

  closeBtn.addEventListener('click', closeOverlay);

  overlay.addEventListener('click', function(e){
    if (e.target === overlay) closeOverlay();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeOverlay();
  });

  // Скрываем hint после первого тапа
  var hint = document.querySelector('.tap-hint');
  catWrap.addEventListener('click', function(){
    if (hint) { hint.style.opacity = '0'; hint.style.transition = 'opacity 0.5s'; }
  }, {once:true});

})();
</script>
</body>
</html>
